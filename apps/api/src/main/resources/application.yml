spring:
  application:
    name: codearchive-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codearchive}
    username: ${DB_USERNAME:codearchive}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  session:
    store-type: jdbc
    servlet:
      cookie:
        name: JSESSIONID
    jdbc:
      # Production is Flyway-owned; local and test profiles override this for H2.
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"
  jackson:
    time-zone: UTC
codearchive:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/api/login/oauth2/code/github}
    dashboard-origin: ${DASHBOARD_ORIGIN:http://localhost:5173}
    # GitHub App credentials are server-only. Leaving either blank keeps the
    # provider fail-closed and records an actionable unavailable state.
    app-id: ${GITHUB_APP_ID:}
    # Keep the deployed PKCS#8 variable compatible while preferring the
    # canonical name for new environments. Both values stay server-only.
    app-private-key: ${GITHUB_APP_PRIVATE_KEY:${GITHUB_APP_PRIVATE_KEY_PKCS8:}}
    app-slug: ${GITHUB_APP_SLUG:}
    # Installation state is signed with server-only App material, bound to the
    # browser session, and expires quickly even if the GitHub flow is abandoned.
    install-state-ttl-seconds: ${GITHUB_INSTALL_STATE_TTL_SECONDS:600}
    # Both bounds are deliberately short: retries are safe only before a
    # possible provider mutation, which the worker classifies separately.
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    request-timeout-ms: ${GITHUB_REQUEST_TIMEOUT_MS:10000}
    worker-delay-ms: ${GITHUB_WORKER_DELAY_MS:30000}
    worker-running-lease-ms: ${GITHUB_WORKER_RUNNING_LEASE_MS:300000}
    # Render stays on polling until an explicitly configured private Cloud Run worker is cut over.
    dispatch-mode: ${GITHUB_DISPATCH_MODE:polling}
    worker:
      http-enabled: ${GITHUB_WORKER_HTTP_ENABLED:false}
    cloud-tasks:
      project-id: ${GCP_PROJECT_ID:}
      location: ${GCP_TASKS_LOCATION:}
      queue-name: ${GCP_TASKS_QUEUE:}
      worker-url: ${GCP_TASKS_WORKER_URL:}
      oidc-service-account: ${GCP_TASKS_OIDC_SERVICE_ACCOUNT:}
      oidc-audience: ${GCP_TASKS_OIDC_AUDIENCE:}
server:
  servlet:
    session:
      # Keep active GitHub logins across ordinary idle periods and browser restarts.
      # Spring Session refreshes the idle deadline whenever the session is used.
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/codearchive;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  session:
    jdbc:
      initialize-schema: always
server:
  address: 127.0.0.1

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:codearchive-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  session:
    jdbc:
      initialize-schema: always
