spring:
  application:
    name: codearchive-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codearchive}
    username: ${DB_USERNAME:codearchive}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    time-zone: UTC
codearchive:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/api/login/oauth2/code/github}
    dashboard-origin: ${DASHBOARD_ORIGIN:http://localhost:5173}
    # GitHub App credentials are server-only. Leaving either blank keeps the
    # provider fail-closed and records an actionable unavailable state.
    app-id: ${GITHUB_APP_ID:}
    app-private-key: ${GITHUB_APP_PRIVATE_KEY:}
    app-slug: ${GITHUB_APP_SLUG:}
    # Installation state is signed with server-only App material, bound to the
    # browser session, and expires quickly even if the GitHub flow is abandoned.
    install-state-ttl-seconds: ${GITHUB_INSTALL_STATE_TTL_SECONDS:600}
    # Both bounds are deliberately short: retries are safe only before a
    # possible provider mutation, which the worker classifies separately.
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    request-timeout-ms: ${GITHUB_REQUEST_TIMEOUT_MS:10000}
    worker-delay-ms: ${GITHUB_WORKER_DELAY_MS:30000}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/codearchive;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
server:
  address: 127.0.0.1

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:codearchive-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
