<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeArchive · 과거 풀이 수집</title><link rel="stylesheet" href="history.css"></head><body><main>
<header><a href="popup.html">← CodeArchive</a><h1>과거 풀이 수집</h1><p id="platform-description">정올의 내 제출 탭을 열어 둔 상태에서 이 브라우저에만 저장합니다. 수집 중에는 원본 탭을 닫거나 이동하지 마세요. 서버 동기화는 대시보드에서 나중에 직접 실행할 수 있습니다.</p></header>
<section><div class="toolbar platform-toolbar"><label>플랫폼 <select id="platform"><option value="JUNGOL">정올</option><option value="SWEA">SWEA</option><option value="PROGRAMMERS">프로그래머스</option></select></label><a id="history-page-link" target="_blank" rel="noopener noreferrer">제출·해결 내역 열기 ↗</a><label>같은 문제 제출 <select id="selection"><option value="all">모두 저장</option><option value="latest">가장 최근 것</option><option value="fastest">가장 빠른 것</option><option value="lowest-memory">메모리가 가장 적은 것</option></select></label></div><p id="platform-help" class="platform-help"></p><div class="actions"><button id="scan" type="button">정올 제출 후보 찾기</button><button id="cancel" type="button" hidden>수집 중단</button><span id="status" role="status">원본 정올 제출 탭을 확인하세요.</span></div><progress id="task-progress" aria-label="과거 풀이 수집 진행률" hidden></progress><p id="progress" aria-live="polite"></p></section>
<section id="candidates" hidden><div class="toolbar"><button id="import" type="button">선택한 0건 로컬 저장</button></div><p id="candidate-help"></p><div id="candidate-list"></div></section>
</main><script src="history.js"></script></body></html>
