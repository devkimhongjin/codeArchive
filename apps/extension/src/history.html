<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeArchive · 과거 풀이 수집</title><link rel="stylesheet" href="history.css"></head><body><main>
<header><a href="popup.html">← CodeArchive</a><h1>과거 풀이 수집</h1><p id="platform-description">플랫폼과 같은 문제 제출 기준을 고른 뒤, 사이트에서 내역을 열어 로컬 수집을 시작하세요.</p></header>
<section class="settings-card" aria-label="수집 설정"><h2>수집 설정</h2><div class="settings-grid"><label>플랫폼 <select id="platform"><option value="JUNGOL">정올</option><option value="SWEA">SWEA</option><option value="PROGRAMMERS">프로그래머스</option></select></label><label>같은 문제 제출 <select id="selection"><option value="all">모두 저장</option><option value="latest">가장 최근 것</option><option value="fastest">가장 빠른 것</option><option value="lowest-memory">메모리가 가장 적은 것</option></select></label></div></section>
<section class="site-navigation" aria-label="사이트 내역 열기"><h2>사이트에서 내역 열기</h2><div class="site-navigation-row"><a id="history-page-link" href="https://jungol.co.kr/" target="_blank" rel="noopener noreferrer">정올 열기 ↗</a><p id="platform-help" class="platform-help">우측 상단 프로필 → 내 정보 → 제출현황에서 내 제출 내역을 열어 주세요.</p></div></section>
<section class="collection-card" aria-label="로컬 수집"><h2>로컬 수집</h2><p id="source-note" class="source-note">수집 중에는 원본 사이트 탭을 열어 두세요. 저장은 이 브라우저에서만 이루어지며, 서버 동기화는 나중에 대시보드에서 직접 실행할 수 있습니다.</p><div class="actions"><button id="scan" type="button">정올 제출 후보 찾기</button><button id="cancel" type="button" hidden>수집 중단</button></div><div class="status-region"><span id="status" role="status">원본 정올 제출 탭을 확인하세요.</span><progress id="task-progress" aria-label="과거 풀이 수집 진행률" hidden></progress><p id="task-stage" aria-live="polite"></p><p id="progress" aria-live="polite"></p><p id="task-time" aria-live="polite"></p><p id="timing-estimate" aria-live="polite" hidden>실측 기록이 없어 예상 시간을 계산할 수 없습니다.</p></div></section>
<section id="candidates" hidden><div class="toolbar"><button id="import" type="button">선택한 0건 로컬 저장</button></div><p id="candidate-help"></p><div id="candidate-list"></div></section>
</main><script src="history.js"></script></body></html>
