<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeArchive · 풀이 수집</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="popup-layout.css"></head><body><main class="popup">
<header><span class="logo">{ }</span><div><h1>CodeArchive</h1><p>통과한 풀이, 차곡차곡.</p></div><span class="release-badge"><span class="badge">BETA</span><span id="updated-label">Updated dev</span></span></header>
<section class="card" id="capture-card" aria-live="polite" aria-busy="true"><div class="row"><h2>대시보드</h2><span id="status">확인 중</span></div><div class="counter"><strong id="pending-count">—</strong><span>개의 풀이</span><button id="refresh" aria-label="수집 상태 새로고침">↻</button></div><p id="capture-description">이 브라우저에 저장된 풀이를 확인하고 있어요.</p><p id="error" role="alert" hidden>저장 상태를 불러오지 못했어요. 새로고침으로 다시 확인해 주세요.</p><a class="primary dashboard-link" href="https://codearchive-dashboard-beta.netlify.app" target="_blank" rel="noopener noreferrer">대시보드 열기 <span>↗</span></a></section>
<section class="automation" aria-live="polite"><div class="row"><h2>자동화</h2><span id="automation-status">설정 확인 중</span></div><label class="switch-row"><input id="auto-download" type="checkbox" role="switch" aria-checked="false"> <span>PASS 시 자동 다운로드</span></label><label class="switch-row"><input id="auto-sync" type="checkbox" role="switch" aria-checked="false"> <span>자동 동기화</span></label><label class="switch-row"><input id="github-auto" type="checkbox" role="switch" aria-checked="false"> <span>GitHub 자동 커밋</span></label><p id="automation-help">연결된 계정 설정을 확인합니다.</p></section>
<section class="recent" id="recent-card" aria-live="polite" aria-busy="true"><div class="row recent-heading"><h2>최근 저장한 풀이</h2><div class="recent-heading-actions"><small id="recent-count">확인 중</small><a class="recent-archive-link" href="archive.html" target="_blank" rel="noopener noreferrer">로컬 저장 전체보기 ↗</a></div></div><div id="recent-list" class="recent-list"></div><p id="recent-empty" hidden>아직 저장된 풀이가 없어요.</p><p id="recent-error" role="alert" hidden>최근 저장한 풀이를 불러오지 못했어요.</p></section>
<footer><span>● 풀이는 먼저 이 브라우저에 저장됩니다.</span><span id="build-label">vdev · dev+source-unknown</span></footer>
</main><script src="popup.js"></script></body></html>
