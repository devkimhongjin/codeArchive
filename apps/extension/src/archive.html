<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CodeArchive · 로컬 저장</title>
    <link rel="stylesheet" href="archive.css">
  </head>
  <body>
    <main class="archive-page">
      <header class="archive-header">
        <div class="brand">
          <span class="logo">{ }</span>
          <div>
            <h1>CodeArchive</h1>
            <p>이 브라우저에 저장한 풀이</p>
          </div>
        </div>
        <a class="back-link" href="popup.html">← 팝업으로 돌아가기</a>
      </header>
      <section class="archive-card" aria-live="polite" aria-busy="true">
        <div class="archive-heading">
          <div>
            <p class="eyebrow">LOCAL ARCHIVE</p>
            <h2>로컬 저장 전체보기</h2>
            <p class="archive-description">대시보드에 동기화한 풀이도 이 브라우저에 계속 보관돼요.</p>
          </div>
          <button id="archive-refresh" type="button">새로고침</button>
        </div>
        <div class="archive-summary"><strong id="archive-count">—</strong><span>개의 풀이</span></div>
        <p id="archive-error" class="archive-error" role="alert" hidden>저장된 풀이를 불러오지 못했어요. 새로고침으로 다시 확인해 주세요.</p>
        <div id="archive-list" class="archive-list"></div>
        <p id="archive-empty" class="archive-empty" hidden>아직 저장된 풀이가 없어요.</p>
      </section>
    </main>
    <script src="archive.js"></script>
  </body>
</html>
