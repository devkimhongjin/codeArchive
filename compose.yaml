services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codearchive
      POSTGRES_USER: codearchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codearchive-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearchive -d codearchive"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  codearchive-db:
