name: Desktop Windows package
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed desktop release after verification
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/dashboard/package-lock.json
            apps/extension/package-lock.json
      - name: Require master release source
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Master source fetch failed' }
          node scripts/release-source.mjs desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop releases must come from master' }
      - run: npm --prefix apps/dashboard ci
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/extension ci
      - run: npm --prefix apps/dashboard test
      - run: npm --prefix apps/desktop test
      - run: npm --prefix apps/extension test
      - run: npm --prefix apps/desktop run dist
        env:
          CODEARCHIVE_RELEASE_BUILD: 'true'
          CODEARCHIVE_BUILD_SHA: ${{ github.sha }}
      - name: Sign update metadata
        shell: pwsh
        env:
          CODEARCHIVE_DESKTOP_UPDATE_KEY: ${{ secrets.CODEARCHIVE_DESKTOP_UPDATE_KEY }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$version") { throw 'Desktop tag does not match package version' }
          node scripts/desktop-release.mjs "output/desktop-packages/CodeArchive-Setup-$version.exe" output/desktop-packages/codearchive-desktop-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Update signing failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: codearchive-desktop-windows
          path: |
            output/desktop-packages/CodeArchive-Setup-*.exe
            output/desktop-packages/codearchive-desktop-update.json
      - name: Publish desktop release
        if: github.ref_type == 'tag' || inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          gh release view "desktop-v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Refusing to replace an existing desktop release' }
          gh release create "desktop-v$version" "output/desktop-packages/CodeArchive-Setup-$version.exe" output/desktop-packages/codearchive-desktop-update.json --target $env:GITHUB_SHA --title "CodeArchive Desktop v$version" --notes-file "docs/releases/desktop-v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release publication failed' }
