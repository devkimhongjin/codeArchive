name: Analysis PR Verify

on:
  pull_request:
    branches:
      - develop
      - master
    paths:
      - 'apps/analysis/**'
      - '.github/workflows/analysis-pr-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/analysis/requirements.txt

      - name: Install analysis dependencies
        working-directory: apps/analysis
        run: python -m pip install -r requirements.txt

      - name: Run analysis tests
        working-directory: apps/analysis
        env:
          ANALYSIS_PROVIDER: fake
          ANALYSIS_INTERNAL_TOKEN: ci-only-not-secret
          OPENAI_API_KEY: ''
          OPENAI_MODEL: ''
        run: python -m pytest
